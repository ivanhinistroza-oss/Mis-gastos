plugins {
    id 'com.android.application'
}

// La firma está en firma.properties (fuera de GitHub). Sin ella se arma solo la versión de prueba.
def firma = new Properties()
def archivoFirma = rootProject.file('firma.properties')
if (archivoFirma.exists()) archivoFirma.withInputStream { firma.load(it) }

android {
    namespace 'pe.misgastos.avisos'
    compileSdk 35

    defaultConfig {
        applicationId 'pe.misgastos.avisos'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
        // La app muestra la web publicada. La versión de prueba (debug) muestra la copia de la PC,
        // servida en el puerto 8123 (10.0.2.2 es la PC vista desde el emulador).
        buildConfigField 'String', 'WEB', '"https://ivanhinistroza-oss.github.io/Mis-gastos/"'
        manifestPlaceholders = [textoClaro: 'false']
    }

    signingConfigs {
        if (archivoFirma.exists()) {
            release {
                storeFile file(firma['archivo'])
                storePassword firma['clave']
                keyAlias firma['alias']
                keyPassword firma['clave']
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'WEB', '"http://10.0.2.2:8123/"'
            manifestPlaceholders = [textoClaro: 'true']
        }
        release {
            minifyEnabled false
            if (archivoFirma.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
